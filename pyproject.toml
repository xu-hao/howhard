[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "howhard"
dynamic = ["version"]
description = "Choose an agent's model and reasoning effort, and learn from outcomes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8", "build"]
docs = ["sphinx>=8", "myst-parser>=4", "furo"]

[project.scripts]
howhard = "howhard.cli:main"

[project.urls]
Repository = "https://github.com/xu-hao/howhard"
Issues = "https://github.com/xu-hao/howhard/issues"
Changelog = "https://github.com/xu-hao/howhard/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "howhard.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
howhard = ["data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
