<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640"
     role="img" aria-labelledby="flow-title flow-description">
  <title id="flow-title">howhard decision flow</title>
  <desc id="flow-description">A task and its candidate cells pass through a capability stage, a forecast stage and a selection stage before the host runs the chosen cell. The project record feeds the first two stages and receives each outcome; a later defect attribution amends the record.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="800" height="640" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#000000">
    <!-- Main flow, left column. -->
    <g fill="none" stroke="#000000" stroke-width="2">
      <rect x="20" y="20" width="470" height="60" rx="8"/>
      <rect x="20" y="114" width="470" height="112" rx="8"/>
      <rect x="20" y="260" width="470" height="112" rx="8"/>
      <rect x="20" y="406" width="470" height="112" rx="8"/>
      <rect x="20" y="552" width="470" height="68" rx="8"/>
      <!-- Record and attribution, right column. -->
      <rect x="530" y="114" width="250" height="112" rx="8"/>
      <rect x="530" y="260" width="250" height="112" rx="8" stroke-width="3"/>
    </g>

    <text x="36" y="45" font-size="16" font-weight="bold">Task, project snapshot and candidate cells</text>
    <text x="36" y="67" font-size="14">supplied by the host that asks for the route</text>

    <text x="36" y="140" font-size="16" font-weight="bold">1. Capability stage</text>
    <text x="36" y="164" font-size="14">An LLM orders every cell for this task; memories adjust</text>
    <text x="36" y="186" font-size="14">Weighted similar runs update the capability threshold</text>
    <text x="36" y="208" font-size="14">The fit band and reserved slots give the forecast cells</text>

    <text x="36" y="286" font-size="16" font-weight="bold">2. Forecast stage</text>
    <text x="36" y="310" font-size="14">LLM forecasts, or this host's stored forecasts</text>
    <text x="36" y="332" font-size="14">The record on other tasks corrects each merged forecast</text>
    <text x="36" y="354" font-size="14">Weighted similar runs reshape each cell's beliefs</text>

    <text x="36" y="432" font-size="16" font-weight="bold">3. Selection</text>
    <text x="36" y="456" font-size="14">Admission tiers from the chance of meeting the defect limit</text>
    <text x="36" y="478" font-size="14">Expected cost to an accepted result, and its spread</text>
    <text x="36" y="500" font-size="14">One Thompson draw among cells whose costs overlap</text>

    <text x="36" y="578" font-size="16" font-weight="bold">The host runs the chosen cell</text>
    <text x="36" y="600" font-size="14">and records its outcome and measured usage</text>

    <text x="546" y="140" font-size="16" font-weight="bold">Later defect attribution</text>
    <text x="546" y="164" font-size="14">A bug fix traces a defect</text>
    <text x="546" y="186" font-size="14">to an earlier accepted run</text>
    <text x="546" y="208" font-size="14">and amends its outcome</text>

    <text x="546" y="286" font-size="16" font-weight="bold">Project record</text>
    <text x="546" y="310" font-size="14">Runs, outcomes and usage</text>
    <text x="546" y="332" font-size="14">Decisions and stored forecasts</text>
    <text x="546" y="354" font-size="14">Memories and expert support</text>

    <!-- Arrows. -->
    <g fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrow)">
      <path d="M 255 80 L 255 112"/>
      <path d="M 255 226 L 255 258"/>
      <path d="M 255 372 L 255 404"/>
      <path d="M 255 518 L 255 550"/>
      <path d="M 655 226 L 655 258"/>
      <path d="M 530 292 L 492 200"/>
      <path d="M 530 316 L 492 316"/>
      <path d="M 490 586 L 655 586 L 655 374"/>
    </g>
  </g>
</svg>
