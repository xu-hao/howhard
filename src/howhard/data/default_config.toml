# Ready-to-use policy. No configuration or parameter tuning is required.
project = "local"
on_cap_unmet = "flag-review"
journal = ".howhard/pending.jsonl"
cache = ".howhard/posterior.npz"

[[logs]]
path = ".howhard/outcomes.jsonl"
project = "local"

[prior]
import = ".howhard/imported-prior.json"

# USD costs of rework and escaped defects; waiting is priced per hour.
[classes.critical]
C_loud = 200.0
C_silent = 20000.0
lambda_per_hour = 50.0
epsilon = 0.05
[classes.contract]
C_loud = 100.0
C_silent = 10000.0
lambda_per_hour = 40.0
epsilon = 0.05
[classes.standard]
C_loud = 50.0
C_silent = 1000.0
lambda_per_hour = 25.0
epsilon = 0.10
[classes.docs]
C_loud = 10.0
C_silent = 100.0
lambda_per_hour = 15.0
epsilon = 0.15
[classes.routine]
C_loud = 1.0
C_silent = 10.0
lambda_per_hour = 10.0
epsilon = 0.20

# A fixed planning mix, dominated by cached context, rather than live billing.
[token_mix]
input = 0.04
output = 0.01
cache_write_5m = 0.01
cache_write_1h = 0.0
cache_read = 0.94

# Registry and list prices checked against Anthropic's docs, 2026-10-29.
# Haiku uses the conservative >100K prompt rate; no API calls are made.
[families.haiku]
tier = 1
current = "claude-haiku-5-5"
selectable = true
[families.sonnet]
tier = 2
current = "claude-sonnet-5-5"
selectable = true
[families.opus]
tier = 3
current = "claude-opus-5-5"
selectable = true
[families.fable]
tier = 4
current = "claude-fable-5-1"
selectable = true
[models.claude-haiku-5-5]
family = "haiku"
default_effort = "medium"
efforts = ["low", "medium", "high", "xhigh", "max"]
weight = 1.0
prices = {input = 0.5, output = 2.5, cache_write_5m = 0.625, cache_write_1h = 1.0, cache_read = 0.05}
[models.claude-sonnet-5-5]
family = "sonnet"
default_effort = "high"
efforts = ["low", "medium", "high", "xhigh", "max"]
weight = 1.0
prices = {input = 2.0, output = 10.0, cache_write_5m = 2.5, cache_write_1h = 4.0, cache_read = 0.1}
[models.claude-opus-5-5]
family = "opus"
default_effort = "medium"
efforts = ["low", "medium", "high", "xhigh", "max"]
weight = 1.0
prices = {input = 4.0, output = 20.0, cache_write_5m = 5.0, cache_write_1h = 8.0, cache_read = 0.2}
[models.claude-fable-5-1]
