# Ready-to-use policy. No configuration or parameter tuning is required.
project = "local"
on_cap_unmet = "flag-review"
journal = ".howhard/pending.jsonl"

[[logs]]
path = ".howhard/outcomes.jsonl"
project = "local"

# USD costs of rework and escaped defects; waiting is priced per hour.
[classes.critical]
C_loud = 200.0
C_silent = 20000.0
lambda_per_hour = 50.0
epsilon = 0.05
[classes.contract]
C_loud = 100.0
C_silent = 10000.0
lambda_per_hour = 40.0
epsilon = 0.05
[classes.standard]
C_loud = 50.0
C_silent = 1000.0
lambda_per_hour = 25.0
epsilon = 0.10
[classes.docs]
C_loud = 10.0
C_silent = 100.0
lambda_per_hour = 15.0
epsilon = 0.15
[classes.routine]
C_loud = 1.0
C_silent = 10.0
lambda_per_hour = 10.0
epsilon = 0.20

# Known identity mappings label evidence; the host supplies candidates and prices.
[models.claude-haiku-5-5]
family = "haiku"
efforts = ["low", "medium", "high", "xhigh", "max"]
weight = 1.0
[models.claude-sonnet-5-5]
family = "sonnet"
efforts = ["low", "medium", "high", "xhigh", "max"]
weight = 1.0
[models.claude-opus-5-5]
family = "opus"
efforts = ["low", "medium", "high", "xhigh", "max"]
weight = 1.0
[models.claude-fable-5-1]
family = "fable"
efforts = ["low", "medium", "high", "xhigh", "max"]
weight = 1.0

[task_types]
contract-change = "contract"
sensitive-change = "critical"
specified-implementation = "standard"
integration-recovery = "standard"
guarded-landing = "standard"
docs-recording-rulings = "docs"
docs-settled-rules = "docs"
probe-or-measurement = "standard"
read-only-survey = "routine"
live-operation-prep = "critical"
live-checklist-run = "critical"
release-qualification = "critical"
preserving-rollout = "critical"
environment-setup = "standard"
bookkeeping = "routine"
worktree-cleanup = "routine"
