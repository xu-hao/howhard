# All statistical assumptions live here. These are maintainers' defaults, not setup tasks.
format = 1
families = ["haiku", "sonnet", "opus", "fable"]
efforts = ["low", "medium", "high", "xhigh", "max"]

[transfer]
variance_inflation = 2.0 # Make transferred evidence less certain in a new project.

[outcome.loud]
a = {mean = -0.5389965007326869, sd = 0.5} # log(0.35 / 0.60).
b = {means = [1.0, 0.4, 0.0, -0.3], sd = 0.7} # Family effects in vocabulary order.
c = {means = [0.6, 0.3, 0.0, -0.15, -0.2], sd = 0.5} # Effort effects in vocabulary order.
d = {mean = 0.0, sd = 0.3} # Family by effort interaction.
u = {means = {critical = 0.3, contract = 0.0, docs = -0.3, standard = -0.2, routine = -1.0}, sd = 0.6} # Task intercept by class.
w = {mean = 0.0, sd = 0.4} # Task by family sensitivity.
v = {mean = 0.0, sd = 0.4} # Task by effort sensitivity.
pi = {mean = 0.0, sd = 0.5} # Project departure from shared effects.
pi_task = {mean = 0.0, sd = 0.3} # Project by task departure.

[outcome.silent]
a = {mean = -2.4849066497880004, sd = 0.5} # log(0.05 / 0.60).
b = {means = [1.0, 0.4, 0.0, -0.3], sd = 0.5} # Equal loud/silent mean shifts preserve escape fractions.
c = {means = [0.6, 0.3, 0.0, -0.15, -0.2], sd = 0.35} # Effort effects, with less silent uncertainty.
d = {mean = 0.0, sd = 0.2} # Family by effort interaction.
u = {means = {critical = 0.3, contract = 0.0, docs = 0.0, standard = -0.3, routine = -1.0}, sd = 0.5} # Task intercept by class.
w = {mean = 0.0, sd = 0.3} # Task by family sensitivity.
v = {mean = 0.0, sd = 0.3} # Task by effort sensitivity.
pi = {mean = 0.0, sd = 0.4} # Project departure from shared effects.
pi_task = {mean = 0.0, sd = 0.25} # Project by task departure.

[tokens]
task = {means = {critical = 17.0, contract = 17.0, docs = 16.0, standard = 16.5, routine = 14.7}, sd = 0.7} # Log total tokens by class.
family = {means = [0.0, 0.0, 0.0, -0.1], sd = 0.4} # Context volume varies little across families.
effort = {means = [-0.6, -0.3, 0.0, 0.2, 0.4], sd = 0.3} # Thinking and tool volume increase with effort.
project = {mean = 0.0, sd = 0.5} # Project-specific context volume.
noise_sd = 1.0 # Fixed log-token observation noise.

[time]
task = {means = {critical = 7.7, contract = 7.7, docs = 7.2, standard = 7.5, routine = 6.6}, sd = 0.7} # Log seconds by class.
family = {means = [-0.4, -0.2, 0.0, 0.3], sd = 0.4} # Relative model latency.
effort = {means = [-0.5, -0.25, 0.0, 0.15, 0.35], sd = 0.3} # Relative effort latency.
project = {mean = 0.0, sd = 0.5} # Project-specific latency.
noise_sd = 1.2 # Fixed log-time observation noise.

[taxonomy.contract-change]
definition = "A code change that needs reasoning about contracts between components"
class = "contract"
[taxonomy.sensitive-change]
definition = "A code change touching money, credentials or concurrency invariants"
class = "critical"
[taxonomy.specified-implementation]
definition = "Implementation of a fully specified change, with its tests"
class = "standard"
[taxonomy.integration-recovery]
definition = "Repairing failures a full test run found in fixtures, test doubles or consumers"
class = "standard"
[taxonomy.guarded-landing]
definition = "Submitting a change through a gated merge, monitoring and recovering from refusals"
class = "standard"
[taxonomy.docs-recording-rulings]
definition = "Design or contract documentation that records new decisions"
class = "docs"
[taxonomy.docs-settled-rules]
definition = "Documentation updated under settled rules, such as runbooks and checklists"
class = "docs"
[taxonomy.probe-or-measurement]
definition = "A probe, benchmark or measurement that tests a hypothesis"
class = "standard"
[taxonomy.read-only-survey]
definition = "A read-only lookup or code survey"
class = "routine"
[taxonomy.live-operation-prep]
definition = "Preparing and verifying offline the scripts and checks for a live operation"
class = "critical"
[taxonomy.live-checklist-run]
definition = "Executing a long checklist against a live system"
class = "critical"
[taxonomy.release-qualification]
definition = "Building and qualifying a release candidate"
class = "critical"
[taxonomy.preserving-rollout]
definition = "Updating a running installation while preserving its state"
class = "critical"
[taxonomy.environment-setup]
definition = "Preparing a validation or development environment"
class = "standard"
[taxonomy.bookkeeping]
definition = "Issue and tracking bookkeeping"
class = "routine"
[taxonomy.worktree-cleanup]
definition = "Removing merged branches, checkouts and scratch files after landing"
class = "routine"
